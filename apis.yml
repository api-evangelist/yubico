aid: yubico
name: Yubico
description: >-
  Yubico is the security company behind the YubiKey hardware authentication
  device and the inventor of the Yubico One-Time Password (OTP). Its public
  developer surface centers on YubiCloud, a hosted REST service that verifies
  Yubico OTPs via a signed HTTPS request to api.yubico.com, alongside a broad
  set of first-party SDKs and libraries for WebAuthn/FIDO2, PIV smart cards,
  OATH, OTP, and the YubiHSM 2 across Python, .NET, Java, Android, iOS, and C,
  plus the ykman command-line tool. Yubico co-authored the FIDO U2F standard,
  ships FIPS 140-3 validated keys, and holds a SOC 2 Type 2 attestation for its
  enterprise services.
